name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a new Windows release (for example v0.4.2); leave empty for a test build'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  gamenight-sdk:
    uses: ontola/gamenight/.github/workflows/godot-sdk-check.yml@main
  simulation-and-integration:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '3766090865330AB2A0ED33594520394B711C620B1378F9223904FAEEF60F2F14') { throw 'Godot checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/godot"
      - name: Import and simulate
        shell: pwsh
        run: |
          $godot = "$env:RUNNER_TEMP/godot/Godot_v4.5.2-stable_win64_console.exe"
          python tools/check.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'Release checks failed' }
      - name: Synthetic host lifecycle
        shell: pwsh
        run: |
          python tests/integration.py --godot "$env:RUNNER_TEMP/godot/Godot_v4.5.2-stable_win64.exe" --headless
          if ($LASTEXITCODE -ne 0) { throw 'Integration failed' }
      - name: Package and verify portable build
        shell: pwsh
        run: |
          python tools/package.py --godot "$env:RUNNER_TEMP/godot/Godot_v4.5.2-stable_win64.exe" --output build/windows
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          python tests/integration.py --godot "$PWD/build/windows/SpaceRacer.exe" --packed --headless
          if ($LASTEXITCODE -ne 0) { throw 'Packaged integration failed' }
      - name: Generate release checksums and GameNight metadata
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          python tools/release_metadata.py --directory build/windows --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: spaceracer-windows
          path: |
            build/windows/spaceracer-windows.zip
            build/windows/release-sha256.txt
            build/windows/spaceracer.catalog.json
          if-no-files-found: error
  publish:
    needs: simulation-and-integration
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spaceracer-windows
          path: release
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A manual build must never attach binaries to another commit's tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          else
            status=$?
            test "$status" = 2
          fi
          cd release
          sha256sum --check release-sha256.txt
          gh release create "$RELEASE_TAG" spaceracer-windows.zip release-sha256.txt spaceracer.catalog.json \
            --target "$RELEASE_COMMIT" --title "SpaceRacer $RELEASE_TAG" \
            --notes-file ../docs/release-notes.md
