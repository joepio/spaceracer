name: Publish GameNight preview
on:
  workflow_run:
    workflows: [Build and release]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  upload:
    if: vars.GAMENIGHT_PUBLISH_ENABLED == 'true'
    uses: ontola/gamenight/.github/workflows/publish-game.yml@main
    secrets: inherit
    with:
      artifact: spaceracer-windows
      game: spaceracer
      file: spaceracer-windows.zip
      entrypoint: SpaceRacer.exe
